        <text x="691" y="337" fill="#D7E3DF" font-size="10">JavaScript</text><text x="999" y="337" text-anchor="end" fill="#91DCC1" font-size="9" font-weight="700">88%</text>
        <rect x="691" y="347" width="308" height="7" rx="3.5" fill="#30464D"/><rect x="691" y="347" width="271" height="7" rx="3.5" fill="url(#teal)"/>
